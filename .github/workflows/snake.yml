name: Generate Snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Generate Snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: debangshumondal06
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=#111111&color_dots=#ffffff,#eeeeee,#cccccc,#999999,#666666
            dist/github-contribution-grid-snake-dark.svg?color_snake=#ffffff&color_dots=#000000,#111111,#222222,#333333,#444444

      - name: Push Snake to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
